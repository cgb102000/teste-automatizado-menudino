name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Toda segunda às 9h (horário de Brasília) para detectar mudanças no site
    - cron: "0 12 * * 1"

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          rfbrowser init chromium

      - name: Rodar testes
        run: python -m robot --outputdir results --variable HEADLESS:True tests

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-robot
          path: results/
          retention-days: 14
