name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Rodar também os testes E2E contra o site (pode ser bloqueado pelo anti-robô do site)"
        type: boolean
        default: false

jobs:
  validacao:
    name: Validação (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Robot Framework
        run: python -m pip install -r requirements.txt robotframework-robocop

      # Padrão de código: documentação de keywords, tamanho de linha, nomes etc.
      - name: Lint (Robocop)
        run: robocop check tests resources

      # Valida sintaxe, keywords e argumentos de todos os testes sem abrir o navegador
      - name: Robot dry-run
        run: python -m robot --dryrun --outputdir results tests

  e2e:
    name: E2E no site
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: validacao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          rfbrowser init chromium

      - name: Rodar testes
        run: python -m robot --outputdir results --variable HEADLESS:True tests

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-robot
          path: results/
          retention-days: 14
